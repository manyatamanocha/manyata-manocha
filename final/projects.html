<style>
  /* Sky theme: painted-sky gradient top, white paper below; mono display type; white boxes with black border + hard shadow. */
  :root {
    color-scheme: light;
    --sky-1: #8fc3ea; --sky-2: #c4e2f6; --sky-3: #eef7fd;
    --paper: #ffffff; --bg: #f7fbfe; --ink: #161616; --dim: #4f5660; --line: #161616;
    --sun: #e46f3a;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --max: 1600px;
  }
  * { box-sizing: border-box; }
  html { overflow-x: clip; scroll-behavior: smooth; }
  body { margin: 0; color: var(--ink); font: 43px/1.6 var(--sans);
    background: linear-gradient(180deg, var(--sky-1) 0, var(--sky-2) 620px, var(--sky-3) 1000px, var(--bg) 1300px) var(--bg) no-repeat;
    padding-left: max(25px, env(safe-area-inset-left, 0px)); padding-right: max(25px, env(safe-area-inset-right, 0px)); padding-block: 0 100px; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .wrap { max-width: var(--max); margin: 0 auto; }
  h1, h2, h3, .serif, .mono { font-family: var(--mono); font-weight: 700; letter-spacing: -0.02em; }

  /* the retro box: white, black border, hard offset shadow */
  .frame, .btn, .pill-link, .shot, .award, .copy, .blk, .num, .steps li, .index a, .tl li, .gallery figure, .quote blockquote {
    background: var(--paper); border: 2px solid var(--line); box-shadow: 5px 5px 0 var(--line); border-radius: 0; }

  /* nav */
  .nav { display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding-block: 26px; }
  .brand { font-family: var(--mono); font-weight: 700; text-decoration: none; font-size: 17px; }
  .links { display: flex; gap: 26px; font-size: 18px; font-weight: 500; }
  .links a { text-decoration: none; }
  .links a:hover { text-decoration: underline; text-underline-offset: 4px; }

  /* hero */
  .sky-hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); align-items: center; min-height: max(520px, calc(100vh - 86px)); min-height: max(520px, calc(100svh - 86px)); padding-block: 72px 40px; }
  .hero-copy { position: relative; z-index: 1; }
  .sky-hero h1 { font-size: clamp(23px, 5vw, 76px); line-height: 1.05; margin: 0; }
  .sky-hero h1 .nm1 { white-space: nowrap; }
  .hero-copy p { font-size: 16px; max-width: 30em; margin: 24px 0 0; color: #23303d; }
  .btns { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 32px; }
  .btn, .pill-link { display: inline-flex; align-items: center; gap: 10px; padding: 13px 24px; font: 600 18px var(--mono); text-decoration: none; color: var(--ink);
    transition: transform .15s cubic-bezier(.2,.8,.2,1), box-shadow .15s cubic-bezier(.2,.8,.2,1); }
  .btn:hover, .pill-link:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--line); }
  .btn:active, .pill-link:active, .copy:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--line); }
  .pill-link .pi { display: inline; background: none; width: auto; height: auto; }
  .frame { margin: 0; padding: 10px; }
  .frame img { display: block; width: 100%; height: auto; }
  .hero-pic { transform: rotate(1.2deg); }
  .cloud { position: absolute; width: 240px; height: 68px; border-radius: 40px; background: #fff7ec; box-shadow: 0 12px 0 #f2dcc2; pointer-events: none; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 108px; height: 108px; left: 36px; top: -56px; }
  .cloud::after { width: 80px; height: 80px; left: 120px; top: -36px; }
  .c1 { left: -10px; top: -18px; transform: scale(.96); } .c2 { left: 42%; top: 0; transform: scale(.66); } .c3 { left: 52%; top: 80%; transform: scale(.84); }
  /* clouds drift: the "translate" property animates on top of each cloud's own scale */
  .cloud { animation: drift 18s ease-in-out infinite alternate, puff 4s ease-in-out infinite; }
  .c1 { animation-duration: 15s, 4.2s; }
  @keyframes drift {
    0%   { translate: 0 0; }
    12%  { translate: 14px -8px; }
    25%  { translate: 30px 0; }
    37%  { translate: 46px -9px; }
    50%  { translate: 62px 0; }
    62%  { translate: 78px -8px; }
    75%  { translate: 94px 0; }
    87%  { translate: 108px -7px; }
    100% { translate: 120px 0; }
  }
  @keyframes puff { 0%, 100% { scale: 1; } 50% { scale: 1.05 .97; } }

  /* section heads */
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-bottom: 26px; }
  .sec-head h2 { font-size: clamp(32px, 4vw, 48px); margin: 0; }
  .label { font: 400 13px var(--mono); color: var(--dim); }

  /* work index: one box per project */
  .index { list-style: none; margin: 0 0 120px; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .index a { display: grid; grid-template-columns: 40px minmax(0, 1fr) 20px; gap: 12px; align-items: baseline; padding: 20px 22px; text-decoration: none;
    transition: transform .15s cubic-bezier(.2,.8,.2,1), box-shadow .15s cubic-bezier(.2,.8,.2,1); }
  .index a:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--line); }
  .index .ix { font: 400 13px var(--mono); color: var(--dim); }
  .index .nm { font-family: var(--mono); font-weight: 700; font-size: 22px; line-height: 1.2; }
  .index .ct { grid-column: 2; font-size: 14px; color: var(--dim); }
  .index .ar { grid-row: 1; grid-column: 3; }

  /* case studies */
  .case { padding-block: 20px 110px; }
  .case-label { display: inline-flex; gap: 10px; font: 400 13px var(--mono); color: var(--dim); }
  .case-label span:first-child { color: var(--sun); font-weight: 700; }
  .case h3 { font-size: clamp(38px, 5.6vw, 72px); line-height: 1.02; margin: 12px 0 0; }
  .case-one { font-size: 20px; max-width: 34em; margin: 18px 0 0; }
  .case-links { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 26px; }
  .shot { margin: 44px 0 0; padding: 10px; overflow: hidden; }
  .shot img { display: block; width: 100%; height: auto; }
  .shot.phone { background: #e9e3ff; display: grid; place-items: center; padding: 40px 20px; }
  .shot.phone img { width: min(280px, 70%); border: 2px solid var(--line); }
  .statvis { display: grid; gap: 6px; padding: clamp(28px, 5vw, 56px); background: #fff3e6; }
  .statvis .serif { font-size: clamp(96px, 16vw, 200px); line-height: .9; color: var(--sun); }
  .statvis figcaption { font-size: 20px; font-weight: 500; }
  .flowvis { padding: clamp(22px, 4vw, 40px); }
  .flowvis ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .flowvis li { border-top: 3px solid var(--line); padding-top: 12px; font-weight: 600; font-size: 15px; line-height: 1.4; }
  .flowvis li:last-child { border-top-color: var(--sun); }
  .flowvis li .serif { display: block; font-size: 28px; color: var(--sun); }
  .flowvis figcaption { margin-top: 22px; color: var(--dim); font-size: 15px; }
  .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 36px; }
  .num { padding: 18px 20px; display: grid; gap: 4px; align-content: start; }
  .num .serif { font-size: clamp(30px, 3.6vw, 44px); line-height: 1.05; }
  .nums .num:first-child .serif { color: var(--sun); }
  .num span:last-child { color: var(--dim); font-size: 14px; line-height: 1.45; }
  .blocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }
  .blk { padding: 22px 24px; }
  .blk h4 { margin: 0 0 10px; font: 700 14px var(--mono); }
  .blk p, .blk li { font-size: 16px; line-height: 1.6; margin: 0; }
  .blk ul { margin: 0; padding-left: 20px; } .blk li { margin-bottom: 5px; }
  .meta { display: flex; flex-wrap: wrap; gap: 14px 44px; margin: 28px 0 0; }
  .meta dt { font: 400 12px var(--mono); color: var(--dim); }
  .meta dd { margin: 4px 0 0; font-size: 15px; font-weight: 500; }

  /* how I work */
  .shot img[src*="hamsty-pile"] { width: 100%; aspect-ratio: 16 / 8; object-fit: cover; object-position: 50% 35%; }
  .how { padding-block: 10px 110px; }
  .coffee-pic { display: block; width: auto; max-width: 100%; height: clamp(260px, 30vw, 380px); margin: 0 auto; }
  .page-head-row { display: flex; align-items: center; justify-content: space-between; gap: 32px; }
  .sofa-pic { width: clamp(140px, 16vw, 200px); height: auto; flex: none; }
  .book-section { padding-block: 80px 90px; }
  .book-container { max-width: 800px; margin: 40px auto; }
  .book { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; min-height: 320px; }
  .page { background: var(--paper); border: 2px solid var(--line); box-shadow: 5px 5px 0 var(--line); padding: 24px; cursor: pointer; transition: transform 0.2s; }
  .page:hover { transform: translateY(-3px); box-shadow: 5px 5px 0 var(--line); }
  .page-num { font: 600 12px var(--mono); color: var(--sun); margin-bottom: 8px; }
  .page-title { font: 700 20px var(--mono); margin: 0 0 6px; }
  .page-cat { font: 400 13px var(--sans); color: var(--dim); }
  .book-nav { display: flex; justify-content: center; gap: 16px; margin-top: 24px; align-items: center; }
  .book-btn { padding: 10px 18px; background: var(--sun); color: white; border: 2px solid var(--line); font: 600 14px var(--mono); cursor: pointer; box-shadow: 4px 4px 0 var(--line); transition: transform 0.1s; }
  .book-btn:hover { transform: translate(-1px, -1px); }
  .book-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--line); }
  .book-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #pageCount { font: 600 14px var(--mono); color: var(--dim); }
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }
  .modal-content { background: var(--paper); border: 2px solid var(--line); box-shadow: 8px 8px 0 var(--line); padding: 36px; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal-close { position: absolute; top: 16px; right: 16px; font-size: 24px; cursor: pointer; background: none; border: none; color: var(--line); font: 700 24px var(--mono); padding: 0; }
  .modal h2 { margin: 0 0 12px; font: 700 26px var(--mono); }
  .modal p { margin: 10px 0; line-height: 1.6; }
  .modal a { color: var(--sun); text-decoration: none; font-weight: 600; }
  .home-work { padding-block: 80px 90px; }
  .home-work .back { margin: 0; }
  .home-work .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  .page:hover { transform: translateY(-3px); box-shadow: 5px 5px 0 var(--line); }

  .page-title { font: 700 20px var(--mono); margin: 0 0 6px; line-height: 1.3; }

  .book-btn { padding: 10px 18px; background: var(--sun); color: white; border: 2px solid var(--line); font: 600 14px var(--mono); cursor: pointer; box-shadow: 4px 4px 0 var(--line); transition: transform 0.1s, box-shadow 0.1s; }
  .book-btn:hover { transform: translate(-1px, -1px); }

  .page-count { font: 600 14px var(--mono); color: var(--dim); min-width: 60px; text-align: center; }
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }

  .modal h2 { margin: 0 0 12px; font: 700 26px var(--mono); }

  .how { padding-top: 70px; }
  .how .sec-head { margin-bottom: 18px; }
  .how-grid { max-width: none; }
  .how-grid .steps { gap: 12px; }
  .how-grid .steps li { padding: 14px 28px; gap: 24px; grid-template-columns: 56px minmax(0, 0.9fr) minmax(0, 2fr); align-items: center; }
  .how-grid .steps .serif { font-size: 24px; }

  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }

  /* quote */
  .quote { padding: 0 max(20px, env(safe-area-inset-left, 0px)) 110px; }
  .quote blockquote { max-width: var(--max); margin: 0 auto; padding: clamp(28px, 5vw, 56px); background: #fff3e6; }
  .quote p { font-family: var(--mono); font-weight: 700; font-size: clamp(22px, 2.8vw, 34px); line-height: 1.3; margin: 0; }

  .collage-pic { background: white; padding: 14px; box-shadow: 0 12px 24px rgba(0,0,0,0.15); flex-shrink: 0; }
  .collage-pic img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .edu b { display: block; } .edu span { color: var(--dim); font-size: 14px; }
  /* PRD pictures: roadmap and claim journey */
